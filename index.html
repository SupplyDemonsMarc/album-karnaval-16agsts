<script>
(function(){
 const prank=document.getElementById('prank');
 const audio=document.getElementById('audio');
 const claim=document.getElementById('claim');
 const canvas=document.getElementById('canvas');
 const ctx=canvas.getContext('2d');
 let raf=0;

 function resize(){
   canvas.width=window.innerWidth;
   canvas.height=window.innerHeight;
 }
 window.addEventListener('resize',resize);
 resize();

 function draw(){
   ctx.fillStyle='#000';
   ctx.fillRect(0,0,canvas.width,canvas.height);

   for(let i=0;i<180;i++){
     const y=Math.random()*canvas.height;
     const h=Math.random()*5+1;
     const x=(Math.random()*canvas.width)-100;
     ctx.fillStyle=Math.random()>.5
       ? 'rgba(0,255,255,'+(Math.random()*.65)+')'
       : 'rgba(255,0,65,'+(Math.random()*.65)+')';
     ctx.fillRect(x,y,Math.random()*220+10,h);
   }

   for(let i=0;i<35;i++){
     ctx.fillStyle=Math.random()>.5?'#00ffff':'#ff174f';
     ctx.fillRect(Math.random()*canvas.width,Math.random()*canvas.height,Math.random()*90+5,Math.random()*3+1);
   }

   raf=requestAnimationFrame(draw);
 }

 claim.addEventListener('click',async function(){
   prank.style.display='block';
   draw();

   // Browser autoplay policy allows playback because this starts directly
   // from the user's click.
   try{
     audio.currentTime=0;
     await audio.play();
   }catch(err){
     console.log('Audio playback:',err);
   }

   if(prank.requestFullscreen){
     try{ await prank.requestFullscreen(); }catch(err){}
   }
 });

 document.addEventListener('keydown',function(e){
   if(e.key==='Escape') closePrank();
 });

 async function closePrank(){
   cancelAnimationFrame(raf);
   prank.style.display='none';
   audio.pause();
   audio.currentTime=0;
   if(document.fullscreenElement){
     try{await document.exitFullscreen();}catch(err){}
   }
 }
})();
</script>
